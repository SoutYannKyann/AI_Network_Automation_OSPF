# docker compose up -d --build      -> Kafka (KRaft), Kafka UI :8080, API/UI :8000, worker
# Secrets come from .env (copy .env.example). Never commit .env.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports: ["29092:29092"]          # host access for a worker/API run outside Docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by the app
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:                          # evidence: "Kafka job is visible"
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATA_DIR: /srv/data
      INVENTORY_PATH: /srv/inventory.yaml
      OLLAMA_URL: http://host.docker.internal:11434   # AI_PROVIDER=ollama: Ollama runs on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/api:/srv/data
      - ./inventory.yaml:/srv/inventory.yaml:ro
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "worker.main"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      API_BASE_URL: http://api:8000
      AUDIT_LOG_PATH: /srv/data/audit.jsonl
      BACKUP_DIR: /srv/data/backups
      INVENTORY_PATH: /srv/inventory.yaml
    volumes:
      - ./data/worker:/srv/data
      - ./inventory.yaml:/srv/inventory.yaml:ro
    depends_on:
      kafka: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped          # crash before commit -> Kafka redelivers (at-least-once)
